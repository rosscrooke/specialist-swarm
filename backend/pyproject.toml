[project]
name = "basecamp-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5",
    "fastapi[standard]>=0.115",
    "playwright>=1.64.1",
    "pydantic>=2.7",
    "pypdf>=7.0.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]
