name: Hopper tests

on:
  push:
    paths:
      - "hopper/**"
      - ".github/workflows/hopper-tests.yml"
  pull_request:
    paths:
      - "hopper/**"
      - ".github/workflows/hopper-tests.yml"
  workflow_dispatch:
    inputs:
      live:
        description: "Also grade the Claude agents (uses the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hopper-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hopper
    env:
      # Offline: no live feeds, no Claude, no keys — the suite uses sample payloads and mocks.
      HOPPER_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hopper/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Agent evals (offline)
        run: python -m evals.run --report "$GITHUB_STEP_SUMMARY" --json eval-results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopper-evals-offline
          path: hopper/eval-results.json
          if-no-files-found: ignore

  ui:
    # Browser smoke tests: the real page in Chromium against an offline server.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hopper
    env:
      HOPPER_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hopper/requirements.txt
            hopper/requirements-ui.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ui.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: python -m pytest -q -p no:cacheprovider tests_ui --tracing retain-on-failure --output ui-results

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hopper-ui-traces
          path: hopper/ui-results
          if-no-files-found: ignore

  evals-live:
    # Manual only: real Claude calls cost money and never run on untrusted PR code.
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hopper
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hopper/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Agent evals (live Claude)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret set; add it under Settings → Secrets → Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python -m evals.run --live --report "$GITHUB_STEP_SUMMARY" --json eval-results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopper-evals-live
          path: hopper/eval-results.json
          if-no-files-found: ignore
