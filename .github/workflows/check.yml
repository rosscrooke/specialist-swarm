# Runs on GitHub's runners, never on the VPS: pull requests from forks run
# this workflow too.
name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Backend imports
        working-directory: backend
        run: uv sync --frozen && ANTHROPIC_API_KEY=x uv run python -c "import app.main"
      - name: Backend tests (offline, no API calls)
        working-directory: backend
        run: uv run python -m pytest tests -q
      - uses: oven-sh/setup-bun@v2
      - name: Frontend builds
        working-directory: frontend
        run: bun install --frozen-lockfile && bunx tsc && bun run build
